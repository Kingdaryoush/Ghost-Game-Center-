header{position:sticky;top:0;z-index:5;background:rgba(7,8,12,.92);backdrop-filter:blur(12px);border-bottom:1px solid #222633}
.nav{max-width:1250px;margin:auto;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:900}.logo b{color:#08ddff}nav a{color:#cdd2dc;text-decoration:none;margin-right:18px;font-size:14px}
.hero{min-height:480px;display:grid;place-items:center;text-align:center;padding:60px 20px;background:radial-gradient(circle at 50% 30%,#29205c,transparent 42%),radial-gradient(circle at 20% 70%,#073e49,transparent 28%),#07080c}

section{max-width:1250px;margin:auto;padding:45px 20px}h2{margin:0 0 8px;font-size:28px}.sub{color:#8991a1;margin-bottom:25px}
.search{width:100%;padding:15px;border-radius:12px;border:1px solid #292e3a;background:#11141c;color:#fff;margin-bottom:22px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.page{padding:0;border:1px solid #262b37;background:#10131a;border-radius:14px;overflow:hidden;color:#fff;cursor:pointer;text-align:center;transition:.2s}.page:hover{transform:translateY(-4px);border-color:#6554dc}.page img{display:block;width:100%;height:auto}.page span{display:block;padding:10px;color:#aeb4c1;font-size:13px}
footer{border-top:1px solid #222633;text-align:center;color:#7d8595;padding:30px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modal img{max-width:min(900px,96vw);max-height:90vh;border-radius:10px}.close{position:fixed;top:18px;left:20px;border:0;background:#222735;color:#fff;border-radius:10px;padding:10px 15px;cursor:pointer}
@media(max-width:650px){nav{display:none}.grid{grid-template-columns:repeat(2,1fr)}}

<div class="modal" id="modal" onclick="closePage()"><button class="close" onclick="event.stopPropagation();closePage()">بستن ✕</button><img id="big" onclick="event.stopPropagation()"></div>
<script>
const grid=document.getElementById('grid'), buttons=[...grid.querySelectorAll('.page')];
document.getElementById('search').oninput=e=>{const q=e.target.value.trim();buttons.forEach(b=>b.style.display=(!q||b.dataset.page.includes(q))?'block':'none')};
function openPage(n){document.getElementById('big').src='page-'+String(n).padStart(2,'0')+'.jpg';document.getElementById('modal').classList.add('show')}
function closePage(){document.getElementById('modal').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePage()});
</script>
